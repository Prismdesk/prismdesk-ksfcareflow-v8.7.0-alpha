<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @keyframes explodeTop {
        0%, 100% { transform: translate(0px, -34px); }
        40%, 60% { transform: translate(0px, -80px); }
      }
      @keyframes explodeMid {
        0%, 100% { transform: translate(0px, 0px); }
        40%, 60% { transform: translate(0px, 0px); }
      }
      @keyframes explodeBase {
        0%, 100% { transform: translate(0px, 34px); }
        40%, 60% { transform: translate(0px, 80px); }
      }

      .exp-top { animation: explodeTop 5s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      .exp-mid { animation: explodeMid 5s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      .exp-base { animation: explodeBase 5s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      ]]>
    </style>

    <radialGradient id="lightGlowExp" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="topExpLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="midExpLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="baseExpLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="edgeHighlightLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="320" r="280" fill="url(#lightGlowExp)"/>

  <g class="exp-base">
    <path d="M 400,280 L 520,340 A 20,20 0 0,1 520,360 L 400,420 A 20,20 0 0,1 380,420 L 260,360 A 20,20 0 0,1 260,340 L 380,280 A 20,20 0 0,1 400,280 Z" fill="url(#baseExpLight)"/>
  </g>
  <g class="exp-mid">
    <path d="M 400,280 L 520,340 A 20,20 0 0,1 520,360 L 400,420 A 20,20 0 0,1 380,420 L 260,360 A 20,20 0 0,1 260,340 L 380,280 A 20,20 0 0,1 400,280 Z" fill="url(#midExpLight)"/>
  </g>
  <g class="exp-top">
    <path d="M 400,280 L 520,340 A 20,20 0 0,1 520,360 L 400,420 A 20,20 0 0,1 380,420 L 260,360 A 20,20 0 0,1 260,340 L 380,280 A 20,20 0 0,1 400,280 Z" fill="url(#topExpLight)"/>
    <path d="M 380,280 L 400,280 L 520,340" stroke="url(#edgeHighlightLight)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <text x="400" y="515" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">Prism<tspan font-weight="800" fill="#2563eb">Desk</tspan></text>
</svg>
