<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @keyframes waveTop {
        0%, 100% { transform: translate(0px, -34px); filter: brightness(1); }
        15%      { transform: translate(0px, -52px); filter: brightness(1.15); }
        30%      { transform: translate(0px, -34px); filter: brightness(1); }
      }
      @keyframes waveMid {
        0%, 15%  { transform: translate(0px, 0px); filter: brightness(1); }
        30%      { transform: translate(0px, -18px); filter: brightness(1.15); }
        45%      { transform: translate(0px, 0px); filter: brightness(1); }
        100%     { transform: translate(0px, 0px); filter: brightness(1); }
      }
      @keyframes waveBase {
        0%, 30%  { transform: translate(0px, 34px); filter: brightness(1); }
        45%      { transform: translate(0px, 16px); filter: brightness(1.15); }
        60%      { transform: translate(0px, 34px); filter: brightness(1); }
        100%     { transform: translate(0px, 34px); filter: brightness(1); }
      }

      .wave-top { animation: waveTop 4s ease-in-out infinite; }
      .wave-mid { animation: waveMid 4s ease-in-out infinite; }
      .wave-base { animation: waveBase 4s ease-in-out infinite; }
      ]]>
    </style>

    <radialGradient id="lightGlowWave" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="topWaveLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="midWaveLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="baseWaveLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="edgeHighlightLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="320" r="280" fill="url(#lightGlowWave)"/>

  <g class="wave-base">
    <path d="M 400,280 L 520,340 A 20,20 0 0,1 520,360 L 400,420 A 20,20 0 0,1 380,420 L 260,360 A 20,20 0 0,1 260,340 L 380,280 A 20,20 0 0,1 400,280 Z" fill="url(#baseWaveLight)"/>
  </g>
  <g class="wave-mid">
    <path d="M 400,280 L 520,340 A 20,20 0 0,1 520,360 L 400,420 A 20,20 0 0,1 380,420 L 260,360 A 20,20 0 0,1 260,340 L 380,280 A 20,20 0 0,1 400,280 Z" fill="url(#midWaveLight)"/>
  </g>
  <g class="wave-top">
    <path d="M 400,280 L 520,340 A 20,20 0 0,1 520,360 L 400,420 A 20,20 0 0,1 380,420 L 260,360 A 20,20 0 0,1 260,340 L 380,280 A 20,20 0 0,1 400,280 Z" fill="url(#topWaveLight)"/>
    <path d="M 380,280 L 400,280 L 520,340" stroke="url(#edgeHighlightLight)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <text x="400" y="515" font-family="'Inter', sans-serif" font-size="52" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">Prism<tspan font-weight="800" fill="#2563eb">Desk</tspan></text>
</svg>
